name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:                   # also run by release.yml for version tags

jobs:
  build:
    runs-on: ubuntu-22.04          # an older system on purpose: the program then runs on newer ones too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System libraries (the same ones the .deb depends on)
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot flatpak libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the program (with ffmpeg for the Flatpak)
        run: bash packaging/linux/build.sh --helpers
      - name: Smoke test the built program
        run: python packaging/linux/smoke.py build/linux/warpdown
      - name: Build the .deb
        run: bash packaging/linux/make_deb.sh
      - name: Install the .deb and start it
        run: |
          sudo apt-get install -y ./dist/warpdown_*_amd64.deb
          test -f /usr/lib/mozilla/native-messaging-hosts/org.warpdown.host.json
          test -f /usr/share/applications/warpdown.desktop
          QT_QPA_PLATFORM=offscreen WARPDOWN_QUIT_AFTER_MS=4000 warpdown
      - name: Build the Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.10
          bash packaging/flatpak/make_flatpak.sh
      - name: Run the Flatpak
        continue-on-error: true            # some CI machines forbid the sandbox; the build above is the real check
        run: |
          flatpak install --user -y --noninteractive --bundle dist/warpdown-*.flatpak
          flatpak run --env=QT_QPA_PLATFORM=offscreen --env=WARPDOWN_QUIT_AFTER_MS=5000 io.github.marius101.Warpdown
      - uses: actions/upload-artifact@v4
        with:
          name: warpdown-linux
          path: |
            dist/warpdown_*_amd64.deb
            dist/warpdown-*.flatpak
