name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: New-Item -ItemType Directory -Force dist | Out-Null
      - run: powershell -File packaging\windows\build.ps1
      - name: Smoke test the built program
        run: python packaging\windows\smoke.py build\windows\warpdown
      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          $v = (python -c "from warpdown import __version__; print(__version__)").Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\warpdown.iss
      - uses: actions/upload-artifact@v4
        with:
          name: warpdown-windows
          path: |
            dist/warpdown-setup-*.exe
            dist/warpdown-windows-portable-*.zip
